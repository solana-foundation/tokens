name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.2
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          install /tmp/gitleaks "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      - name: Scan tracked files
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir . --redact

      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --verbose

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile
      - run: bun run check:repo-hygiene
      - run: bun run audit:deps
