name: Cloud Run deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target env (stg / prd)'
        required: true
        default: 'stg'
        type: choice
        options: [stg, prd]
      service:
        description: 'Cloud Run service (assets / prices / usage / admin)'
        required: true
        default: 'assets'
        type: choice
        options: [assets, prices, usage, admin]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-deploy-${{ inputs.env }}-${{ inputs.service }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.9.8
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: us-east4

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.env == 'prd' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDRUN_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/tokens-${{ inputs.env }}/${{ inputs.service }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" -f apps/cloudrun-${{ inputs.service }}/Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        id: build

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ inputs.service }}" = "assets" ]; then
            extra+=(--update-env-vars=SERVICE_ROLE=api,PG_POOL_MAX=16,PG_CONNECT_TIMEOUT=3)
          fi
          if [ "${{ inputs.env }}" = "prd" ] && [ "${{ inputs.service }}" = "assets" ]; then
            candidate_tag="resilience-${GITHUB_SHA:0:12}"
            gcloud run deploy tokens-assets-prd-us \
              --image="$IMAGE" \
              --region=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT }} \
              --no-traffic \
              --tag="$candidate_tag" \
              "${extra[@]}" \
              --quiet
            candidate_revision=$(gcloud run services describe tokens-assets-prd-us --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} --format='value(status.latestCreatedRevisionName)')
            {
              echo "### Assets production candidate"
              echo "Revision \`$candidate_revision\` was deployed with **0% traffic**."
              echo "Promote it manually through 10% → 50% → 100% using the assets DB resilience runbook."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # prices / usage / admin (and every stg service): land at 0% behind
            # a tag, probe the new revision through Cloud Run's frontend, and
            # only then route traffic to it. 2026-10-30: the frontend answered
            # ~5% of requests to a fresh usage revision with its own 404 for
            # 22 minutes, and a straight-to-100% deploy turned that into an
            # API-wide 5xx page (scripts/probe-cloudrun-revision.sh). Traffic
            # is pinned to the revision by name, as the assets promotion does.
            svc="tokens-${{ inputs.service }}-${{ inputs.env }}-us"
            tag="cand-${GITHUB_SHA:0:12}"
            gc() { gcloud run services "$@" --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }}; }
            gcloud run deploy "$svc" \
              --image="$IMAGE" \
              --region=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT }} \
              --no-traffic \
              --tag="$tag" \
              "${extra[@]}" \
              --quiet
            rev=$(gc describe "$svc" --format='value(status.latestCreatedRevisionName)')
            tag_url=$(gc describe "$svc" --format=json \
              | jq -r --arg t "$tag" '[.status.traffic[] | select(.tag == $t) | .url][0] // empty')
            if [ -z "$tag_url" ]; then
              echo "::error::$svc: revision $rev has no URL for tag $tag; traffic left on the previous revision."
              exit 1
            fi
            if ! scripts/probe-cloudrun-revision.sh "$tag_url" 100; then
              gc update-traffic "$svc" --remove-tags="$tag" --quiet || true
              echo "::error::$svc: revision $rev failed the pre-traffic probe (see above); traffic left on the previous revision. Investigate, then re-run this deploy."
              exit 1
            fi
            gc update-traffic "$svc" --to-revisions="$rev=100" --quiet
            gc update-traffic "$svc" --remove-tags="$tag" --quiet || true
            {
              echo "### $svc"
              echo "Revision \`$rev\` passed 100/100 frontend probes and now serves 100% of traffic."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          jobs_service=tokens-assets-jobs-${{ inputs.env }}-us
          if [ "${{ inputs.service }}" = "assets" ] && gcloud run services describe "$jobs_service" --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} >/dev/null 2>&1; then
            worker_traffic=()
            # Tag + service name are capped at 46 chars; the jobs service name is
            # 25, so the API's resilience-<sha12> tag (23) does not fit here.
            if [ "${{ inputs.env }}" = "prd" ]; then worker_traffic+=(--no-traffic --tag="res-${GITHUB_SHA:0:12}"); fi
            gcloud run deploy "$jobs_service" --image="$IMAGE" --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} --update-env-vars=SERVICE_ROLE=worker,PG_POOL_MAX=8,PG_CONNECT_TIMEOUT=3 "${worker_traffic[@]}" --quiet
          fi

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -z "${SLACK_WEBHOOK:-}" ] && exit 0
          STATUS="${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}"
          COLOR="${{ job.status == 'success' && '#36a64f' || '#ff0000' }}"
          MARKER="[$STATUS] Deploy Tokens API"
          FIELDS=$(jq -n \
            --arg env "${{ inputs.env }}" --arg svc "${{ inputs.service }}" \
            --arg sha "${GITHUB_SHA:0:7}" --arg actor "$GITHUB_ACTOR" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '[
              {type:"mrkdwn", text:("*Tiers:*\n`cloud-run/"+$svc+"`")},
              {type:"mrkdwn", text:("*Env:*\n`"+$env+"`")},
              {type:"mrkdwn", text:("*Commit:*\n`"+$sha+"`")},
              {type:"mrkdwn", text:("*Triggered by:*\n"+$actor)},
              {type:"mrkdwn", text:("*Run:*\n<"+$run_url+"|workflow>")}
            ]')
          PAYLOAD=$(jq -n \
            --arg marker "$MARKER" --arg tiers "cloud-run/${{ inputs.service }}" \
            --arg color "$COLOR" --argjson fields "$FIELDS" \
            '{
              text: ("*" + $marker + "* — tiers: `" + $tiers + "`"),
              attachments: [{ color: $color, blocks: [
                {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                {type:"section", fields:$fields}
              ]}]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK" || true
