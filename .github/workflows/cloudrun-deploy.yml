name: Cloud Run deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target env (stg / prd)'
        required: true
        default: 'stg'
        type: choice
        options: [stg, prd]
      service:
        description: 'Cloud Run service (assets / prices / usage / admin)'
        required: true
        default: 'assets'
        type: choice
        options: [assets, prices, usage, admin]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-deploy-${{ inputs.env }}-${{ inputs.service }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.9.8
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: us-east4

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.env == 'prd' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDRUN_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/tokens-${{ inputs.env }}/${{ inputs.service }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" -f apps/cloudrun-${{ inputs.service }}/Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        id: build

      # The pre-traffic probe below must reach the candidate as an authorised
      # caller: on an IAM-gated service (admin) an unauthenticated request is
      # answered 403 by Cloud Run before it reaches any revision, which proves
      # nothing. The deployer SA may invoke every service (roles/run.admin
      # carries run.routes.invoke), but WIF credentials cannot run
      # `gcloud auth print-identity-token --audiences`, and the SA cannot mint
      # an ID token for itself (serviceAccountUser lacks getOpenIdToken). The
      # federated principal can (roles/iam.workloadIdentityUser), which is what
      # the auth action's id_token format does. Cloud Run requires the
      # service's own URL as the audience even for requests to a tag URL.
      - name: Resolve service URL for the probe token
        id: svc
        if: ${{ !(inputs.env == 'prd' && inputs.service == 'assets') }}
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "tokens-${{ inputs.service }}-${{ inputs.env }}-us" \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} --format='value(status.url)')
          [ -n "$url" ] || { echo "::error::could not resolve the service URL for the probe token"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Mint the probe identity token
        id: probe_token
        if: ${{ !(inputs.env == 'prd' && inputs.service == 'assets') }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDRUN_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.svc.outputs.url }}
          id_token_include_email: true

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          PROBE_ID_TOKEN: ${{ steps.probe_token.outputs.id_token }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ inputs.service }}" = "assets" ]; then
            extra+=(--update-env-vars=SERVICE_ROLE=api,PG_POOL_MAX=16,PG_CONNECT_TIMEOUT=3)
          fi
          if [ "${{ inputs.env }}" = "prd" ] && [ "${{ inputs.service }}" = "assets" ]; then
            candidate_tag="resilience-${GITHUB_SHA:0:12}"
            gcloud run deploy tokens-assets-prd-us \
              --image="$IMAGE" \
              --region=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT }} \
              --no-traffic \
              --tag="$candidate_tag" \
              "${extra[@]}" \
              --quiet
            candidate_revision=$(gcloud run services describe tokens-assets-prd-us --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} --format='value(status.latestCreatedRevisionName)')
            {
              echo "### Assets production candidate"
              echo "Revision \`$candidate_revision\` was deployed with **0% traffic**."
              echo "Promote it manually through 10% → 50% → 100% using the assets DB resilience runbook."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # prices / usage / admin (and every stg service): land at 0% behind
            # a tag, probe the new revision through Cloud Run's frontend, and
            # only then route traffic to it. 2026-10-30: the frontend answered
            # ~5% of requests to a fresh usage revision with its own 404 for
            # 22 minutes, and a straight-to-100% deploy turned that into an
            # API-wide 5xx page (scripts/probe-cloudrun-revision.sh). Traffic
            # is pinned to the revision by name, as the assets promotion does.
            svc="tokens-${{ inputs.service }}-${{ inputs.env }}-us"
            tag="cand-${GITHUB_SHA:0:12}"
            gc() { gcloud run services "$@" --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }}; }
            # The "Remove candidate tag" step below drops the tag however this
            # step ends (probe failure, describe/traffic errors, cancellation),
            # so a failed deploy cannot leave a warm tagged revision behind.
            { echo "CANDIDATE_SERVICE=$svc"; echo "CANDIDATE_TAG=$tag"; } >> "$GITHUB_ENV"
            gcloud run deploy "$svc" \
              --image="$IMAGE" \
              --region=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT }} \
              --no-traffic \
              --tag="$tag" \
              "${extra[@]}" \
              --quiet
            # Read the revision from the SAME tagged traffic entry as the URL:
            # latestCreatedRevisionName could name a revision an overlapping
            # manual deploy created, and traffic must go to the one we probed.
            desc=$(gc describe "$svc" --format=json)
            rev=$(jq -r --arg t "$tag" '[.status.traffic[] | select(.tag == $t) | .revisionName][0] // empty' <<<"$desc")
            tag_url=$(jq -r --arg t "$tag" '[.status.traffic[] | select(.tag == $t) | .url][0] // empty' <<<"$desc")
            if [ -z "$rev" ] || [ -z "$tag_url" ]; then
              echo "::error::$svc: no revision/URL found for tag $tag; traffic left on the previous revision."
              exit 1
            fi
            if [ -z "${PROBE_ID_TOKEN:-}" ]; then
              echo "::error::$svc: no identity token for the probe (see the 'Mint the probe identity token' step); traffic left on the previous revision."
              exit 1
            fi
            # PROBE_ID_TOKEN (step env, minted above) authenticates the probe as
            # the deployer SA; the probe requires 200 from /health.
            if ! scripts/probe-cloudrun-revision.sh "$tag_url" 100; then
              echo "::error::$svc: revision $rev failed the pre-traffic probe (see above); traffic left on the previous revision. Investigate, then re-run this deploy."
              exit 1
            fi
            gc update-traffic "$svc" --to-revisions="$rev=100" --quiet
            {
              echo "### $svc"
              echo "Revision \`$rev\` answered 100/100 authenticated /health probes and now serves 100% of traffic."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          jobs_service=tokens-assets-jobs-${{ inputs.env }}-us
          if [ "${{ inputs.service }}" = "assets" ] && gcloud run services describe "$jobs_service" --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} >/dev/null 2>&1; then
            worker_traffic=()
            # Tag + service name are capped at 46 chars; the jobs service name is
            # 25, so the API's resilience-<sha12> tag (23) does not fit here.
            if [ "${{ inputs.env }}" = "prd" ]; then worker_traffic+=(--no-traffic --tag="res-${GITHUB_SHA:0:12}"); fi
            gcloud run deploy "$jobs_service" --image="$IMAGE" --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} --update-env-vars=SERVICE_ROLE=worker,PG_POOL_MAX=8,PG_CONNECT_TIMEOUT=3 "${worker_traffic[@]}" --quiet
          fi

      - name: Remove candidate tag
        # Runs even when the deploy step failed or the run was cancelled. A
        # tagged revision on a service with minScale stays warm forever and
        # reserves subnet IPs (see #213/#214), so never leave one behind.
        if: always() && env.CANDIDATE_TAG != ''
        run: |
          set -euo pipefail
          tagged=$(gcloud run services describe "$CANDIDATE_SERVICE" --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} --format=json 2>/dev/null \
            | jq -r --arg t "$CANDIDATE_TAG" '[.status.traffic[]? | select(.tag == $t)] | length' || echo 0)
          if [ "$tagged" = "0" ]; then
            echo "$CANDIDATE_SERVICE: tag $CANDIDATE_TAG not present, nothing to clean up"
            exit 0
          fi
          if gcloud run services update-traffic "$CANDIDATE_SERVICE" --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} --remove-tags="$CANDIDATE_TAG" --quiet; then
            echo "$CANDIDATE_SERVICE: removed tag $CANDIDATE_TAG"
          else
            echo "::warning::$CANDIDATE_SERVICE: could not remove tag $CANDIDATE_TAG; remove it by hand so the revision can scale to zero."
          fi

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -z "${SLACK_WEBHOOK:-}" ] && exit 0
          STATUS="${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}"
          COLOR="${{ job.status == 'success' && '#36a64f' || '#ff0000' }}"
          MARKER="[$STATUS] Deploy Tokens API"
          FIELDS=$(jq -n \
            --arg env "${{ inputs.env }}" --arg svc "${{ inputs.service }}" \
            --arg sha "${GITHUB_SHA:0:7}" --arg actor "$GITHUB_ACTOR" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '[
              {type:"mrkdwn", text:("*Tiers:*\n`cloud-run/"+$svc+"`")},
              {type:"mrkdwn", text:("*Env:*\n`"+$env+"`")},
              {type:"mrkdwn", text:("*Commit:*\n`"+$sha+"`")},
              {type:"mrkdwn", text:("*Triggered by:*\n"+$actor)},
              {type:"mrkdwn", text:("*Run:*\n<"+$run_url+"|workflow>")}
            ]')
          PAYLOAD=$(jq -n \
            --arg marker "$MARKER" --arg tiers "cloud-run/${{ inputs.service }}" \
            --arg color "$COLOR" --argjson fields "$FIELDS" \
            '{
              text: ("*" + $marker + "* — tiers: `" + $tiers + "`"),
              attachments: [{ color: $color, blocks: [
                {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                {type:"section", fields:$fields}
              ]}]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK" || true
