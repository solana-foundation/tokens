name: Grafana push (dashboards + alert rules)

on:
  push:
    branches: [main]
    paths:
      - 'dashboards/**'
      - 'alert-rules/**'
      - 'notification-policies/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: tokens
      DOPPLER_CONFIG: prd

    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Fetch secrets from Doppler
        id: secrets
        run: |
          set -euo pipefail
          for key in GRAFANA_API_URL GRAFANA_API_TOKEN GRAFANA_FOLDER_UID PAGERDUTY_INTEGRATION_KEY SLACK_ALERT_WEBHOOK_URL; do
            value=$(doppler secrets get "$key" --plain --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG")
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Push dashboards
        if: hashFiles('dashboards/*.json') != ''
        env:
          GRAFANA_API_URL: ${{ steps.secrets.outputs.GRAFANA_API_URL }}
          GRAFANA_API_TOKEN: ${{ steps.secrets.outputs.GRAFANA_API_TOKEN }}
          GRAFANA_FOLDER_UID: ${{ steps.secrets.outputs.GRAFANA_FOLDER_UID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dashboards/*.json; do
            name=$(basename "$f")
            echo "::group::Push $name"
            payload=$(jq --arg folder "$GRAFANA_FOLDER_UID" \
              --arg msg "Pushed from $(git rev-parse --short HEAD)" \
              '{dashboard: ., folderUid: $folder, overwrite: true, message: $msg}' "$f")
            http_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -X POST "$GRAFANA_API_URL/api/dashboards/db" \
              -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload")
            if [ "$http_code" -ge 300 ]; then
              echo "::error file=$f::Push failed ($http_code)"
              cat /tmp/resp.json
              exit 1
            fi
            jq -r '"  uid=\(.uid) url=\(.url)"' /tmp/resp.json
            echo "::endgroup::"
          done

      - name: Push alert rules
        if: hashFiles('alert-rules/*.json') != ''
        env:
          GRAFANA_API_URL: ${{ steps.secrets.outputs.GRAFANA_API_URL }}
          GRAFANA_API_TOKEN: ${{ steps.secrets.outputs.GRAFANA_API_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in alert-rules/*.json; do
            name=$(basename "$f")
            echo "::group::Push $name"
            uid=$(jq -r '.uid // empty' "$f")
            if [ -z "$uid" ]; then
              echo "::error file=$f::missing top-level .uid"
              exit 1
            fi
            payload=$(cat "$f")
            http_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -X PUT "$GRAFANA_API_URL/api/v1/provisioning/alert-rules/$uid" \
              -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'X-Disable-Provenance: true' \
              --data "$payload")
            if [ "$http_code" = "404" ]; then
              http_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
                -X POST "$GRAFANA_API_URL/api/v1/provisioning/alert-rules" \
                -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
                -H 'Content-Type: application/json' \
                -H 'X-Disable-Provenance: true' \
                --data "$payload")
            fi
            if [ "$http_code" -ge 300 ]; then
              echo "::error file=$f::Push failed ($http_code)"
              cat /tmp/resp.json
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Push contact points
        if: hashFiles('notification-policies/contact-points/*.json') != ''
        env:
          GRAFANA_API_URL: ${{ steps.secrets.outputs.GRAFANA_API_URL }}
          GRAFANA_API_TOKEN: ${{ steps.secrets.outputs.GRAFANA_API_TOKEN }}
          PAGERDUTY_INTEGRATION_KEY: ${{ steps.secrets.outputs.PAGERDUTY_INTEGRATION_KEY }}
          SLACK_ALERT_WEBHOOK_URL: ${{ steps.secrets.outputs.SLACK_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          existing=$(curl -sS "$GRAFANA_API_URL/api/v1/provisioning/contact-points" \
            -H "Authorization: Bearer $GRAFANA_API_TOKEN")
          for f in notification-policies/contact-points/*.json; do
            name=$(jq -r '.name' "$f")
            payload=$(envsubst < "$f")
            uid=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .uid // empty' <<<"$existing" | head -1)
            if [ -n "$uid" ]; then
              http_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
                -X PUT "$GRAFANA_API_URL/api/v1/provisioning/contact-points/$uid" \
                -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
                -H 'Content-Type: application/json' \
                -H 'X-Disable-Provenance: true' \
                --data "$payload")
            else
              http_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
                -X POST "$GRAFANA_API_URL/api/v1/provisioning/contact-points" \
                -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
                -H 'Content-Type: application/json' \
                -H 'X-Disable-Provenance: true' \
                --data "$payload")
            fi
            if [ "$http_code" -ge 300 ]; then
              echo "::error file=$f::Push failed ($http_code)"
              cat /tmp/resp.json
              exit 1
            fi
            echo "  $(basename $f): $http_code"
          done

      - name: Push notification policy
        if: hashFiles('notification-policies/policy.json') != ''
        env:
          GRAFANA_API_URL: ${{ steps.secrets.outputs.GRAFANA_API_URL }}
          GRAFANA_API_TOKEN: ${{ steps.secrets.outputs.GRAFANA_API_TOKEN }}
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X PUT "$GRAFANA_API_URL/api/v1/provisioning/policies" \
            -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-Disable-Provenance: true' \
            --data "$(cat notification-policies/policy.json)")
          if [ "$http_code" -ge 300 ]; then
            echo "::error::Notification policy push failed ($http_code)"
            cat /tmp/resp.json
            exit 1
          fi
          echo "  policy: $http_code"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -z "${SLACK_WEBHOOK:-}" ] && exit 0
          SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAYLOAD=$(jq -n \
            --arg sha "$SHA" --arg actor "$GITHUB_ACTOR" --arg run_url "$RUN_URL" \
            '{
              text: "*[FAILED] grafana-push* — dashboards/alerts/policies did not sync to Grafana",
              attachments: [{
                color: "#ff0000",
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:"*[FAILED] grafana-push*\nDashboards / alert rules / contact points / policy did not sync to Grafana. Grafana is now drifted from `main`."}},
                  {type:"section", fields:[
                    {type:"mrkdwn", text:("*Commit:*\n`"+$sha+"`")},
                    {type:"mrkdwn", text:("*Triggered by:*\n"+$actor)},
                    {type:"mrkdwn", text:("*Run:*\n<"+$run_url+"|workflow logs>")}
                  ]}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK" || true
