name: Tokens Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (defaults to main)'
        required: false
        default: 'main'
      cloudrun:
        description: 'Cloud Run services (auto = detect from changed files vs HEAD^)'
        required: false
        type: choice
        default: auto
        options: [auto, none, all, assets, prices, usage, admin]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      assets: ${{ steps.detect.outputs.assets }}
      services: ${{ steps.detect.outputs.services }}
      tiers: ${{ steps.detect.outputs.tiers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      # Path-detection with manual override, mirroring geyser-data's deploy
      # tiers: `auto` (default) resolves from the changed files; a named
      # service forces exactly that one; `all` forces every service; `none`
      # skips Cloud Run entirely. packages/ is shared — baked into every
      # image — so any change there rebuilds all four.
      - id: detect
        env:
          MODE: ${{ inputs.cloudrun || 'auto' }}
        run: |
          set -euo pipefail
          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          fi
          match() { echo "$CHANGED_FILES" | grep -qE "$1"; }

          changed=""
          case "$MODE" in
            none) ;;
            all) changed="assets prices usage admin" ;;
            assets|prices|usage|admin) changed="$MODE" ;;
            auto|*)
              for svc in assets prices usage admin; do
                match "^(apps/cloudrun-$svc/|packages/)" && changed="$changed $svc"
              done
              ;;
          esac
          changed=$(echo $changed)
          services='[]'
          [ -n "$changed" ] && services=$(printf '%s\n' $changed | jq -R . | jq -sc .)
          assets=false
          case " $changed " in *" assets "*) assets=true;; esac
          tiers="api+app+admin"
          [ -n "$changed" ] && tiers="api+app+admin+cloud-run/{${changed// /,}}"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "tiers=$tiers" >> "$GITHUB_OUTPUT"

  notify_start:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Notify Slack — deploy started
        env:
          TIERS: ${{ needs.changes.outputs.tiers }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SLACK_WEBHOOK=$(doppler secrets get SLACK_DEPLOY_WEBHOOK_URL --plain --project tokens --config prd)
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          PAYLOAD=$(jq -n \
            --arg marker "[STARTED] Tokens Deploy" \
            --arg tiers "$TIERS" \
            --arg short_sha "${SHA:0:7}" --arg commit_msg "$COMMIT_MSG" \
            --arg actor "$ACTOR" --arg run_url "$RUN_URL" --arg run_id "$RUN_ID" \
            '{
              text: ("*" + $marker + "* — tiers: `" + $tiers + "`"),
              attachments: [{
                color: "#36a64f",
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                  {type:"section", fields:[
                    {type:"mrkdwn",text:("*Tiers:*\n`"+$tiers+"`")},
                    {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
                    {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
                    {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
                  ]}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK" || true

  cloudrun_stg:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDRUN_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker us-east4-docker.pkg.dev --quiet

      - name: Build and push image
        id: build
        env:
          IMAGE: us-east4-docker.pkg.dev/${{ vars.GCP_PROJECT }}/tokens-stg/${{ matrix.service }}:${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" -f apps/cloudrun-${{ matrix.service }}/Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run revision (stg)
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ matrix.service }}" = "assets" ]; then
            extra+=(--update-env-vars=SERVICE_ROLE=api,PG_POOL_MAX=16,PG_CONNECT_TIMEOUT=3)
          fi
          gcloud run deploy tokens-${{ matrix.service }}-stg-us \
            --image="$IMAGE" \
            --region=us-east4 \
            --project=${{ vars.GCP_PROJECT }} \
            "${extra[@]}" \
            --quiet
          if [ "${{ matrix.service }}" = "assets" ] && gcloud run services describe tokens-assets-jobs-stg-us --region=us-east4 --project=${{ vars.GCP_PROJECT }} >/dev/null 2>&1; then
            gcloud run deploy tokens-assets-jobs-stg-us --image="$IMAGE" --region=us-east4 --project=${{ vars.GCP_PROJECT }} --update-env-vars=SERVICE_ROLE=worker,PG_POOL_MAX=8,PG_CONNECT_TIMEOUT=3 --quiet
          fi

  # Stage tier: Vercel previews + gates. Prod Vercel deploys moved to
  # deploy_prod, which runs AFTER cloudrun_prd — the API must never go live
  # against Cloud Run services that don't know its new RPCs (2026-09-04
  # curated-lists incident).
  deploy_stage:
    needs: [changes, notify_start, cloudrun_stg]
    if: >-
      always() &&
      (needs.cloudrun_stg.result == 'success' || needs.cloudrun_stg.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: tokens
      DOPPLER_CONFIG: prd
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - run: bun install --frozen-lockfile

      - name: Fetch secrets from Doppler
        id: secrets
        run: |
          set -euo pipefail
          for key in \
            SLACK_DEPLOY_WEBHOOK_URL \
            VERCEL_TOKEN \
            VERCEL_PROJECT_ID \
            VERCEL_PROJECT_ID_APP \
            VERCEL_PROJECT_ID_ADMIN \
            TOKENS_API_KEY \
            TOKENS_API_KEY_STAGING \
            CLERK_JWT_ISSUER_DOMAIN \
            TOKENS_API_STAGE_URL \
            TOKENS_API_PROD_URL \
            TOKENS_APP_STAGE_URL \
            TOKENS_APP_PROD_URL \
            TOKENS_ADMIN_STAGE_URL \
            TOKENS_ADMIN_PROD_URL; do
            value=$(doppler secrets get "$key" --plain --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG")
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Build Slack fields
        id: summary
        env:
          TIERS: ${{ needs.changes.outputs.tiers }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          FIELDS=$(jq -n \
            --arg tiers      "$TIERS" \
            --arg short_sha  "${SHA:0:7}" \
            --arg commit_msg "$COMMIT_MSG" \
            --arg actor      "$ACTOR" \
            --arg run_url    "$RUN_URL" \
            --arg run_id     "$RUN_ID" \
            '[
              {type:"mrkdwn",text:("*Tiers:*\n`"+$tiers+"`")},
              {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
              {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
              {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
            ]')
          {
            echo 'fields<<JQ_EOF'
            echo "$FIELDS"
            echo 'JQ_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: bun add -g vercel@54.9.0

      - name: Deploy API to stage (Vercel preview)
        id: deploy_api_stage
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          STAGE_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN" --scope solana-foundation)
          echo "stage_url=$STAGE_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed tokens-api stage: $STAGE_URL"

      - name: Alias API stage to TOKENS_API_STAGE_URL
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID }}
          STAGE_URL: ${{ steps.deploy_api_stage.outputs.stage_url }}
          TOKENS_API_STAGE_URL: ${{ steps.secrets.outputs.TOKENS_API_STAGE_URL }}
        run: |
          set -euo pipefail
          domain="${TOKENS_API_STAGE_URL#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"
          vercel alias set "$STAGE_URL" "$domain" --token="$VERCEL_TOKEN" --scope solana-foundation

      - name: Deploy APP to stage (Vercel preview)
        id: deploy_app_stage
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_APP }}
        run: |
          set -euo pipefail
          STAGE_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN" --scope solana-foundation)
          echo "stage_url=$STAGE_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed tokens-app stage: $STAGE_URL"

      - name: Alias APP stage to TOKENS_APP_STAGE_URL
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_APP }}
          STAGE_URL: ${{ steps.deploy_app_stage.outputs.stage_url }}
          TOKENS_APP_STAGE_URL: ${{ steps.secrets.outputs.TOKENS_APP_STAGE_URL }}
        run: |
          set -euo pipefail
          domain="${TOKENS_APP_STAGE_URL#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"
          vercel alias set "$STAGE_URL" "$domain" --token="$VERCEL_TOKEN" --scope solana-foundation

      - name: Deploy ADMIN to stage (Vercel preview)
        id: deploy_admin_stage
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_ADMIN }}
        run: |
          set -euo pipefail
          STAGE_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN" --scope solana-foundation)
          echo "stage_url=$STAGE_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed tokens-admin stage: $STAGE_URL"

      - name: Alias ADMIN stage to TOKENS_ADMIN_STAGE_URL
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_ADMIN }}
          STAGE_URL: ${{ steps.deploy_admin_stage.outputs.stage_url }}
          TOKENS_ADMIN_STAGE_URL: ${{ steps.secrets.outputs.TOKENS_ADMIN_STAGE_URL }}
        run: |
          set -euo pipefail
          domain="${TOKENS_ADMIN_STAGE_URL#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"
          vercel alias set "$STAGE_URL" "$domain" --token="$VERCEL_TOKEN" --scope solana-foundation

      # Minimal gate: the admin app is Clerk-gated, so unauthenticated requests
      # legitimately redirect to sign-in — anything non-5xx means it serves.
      - name: ADMIN stage gate
        env:
          TOKENS_ADMIN_STAGE_URL: ${{ steps.secrets.outputs.TOKENS_ADMIN_STAGE_URL }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$TOKENS_ADMIN_STAGE_URL")
          echo "admin stage responded $code"
          case "$code" in
            5*|000) echo "admin stage gate failed ($code)" >&2; exit 1 ;;
          esac

      - name: API stage smoke gate
        env:
          TOKENS_API_BASE_URL: ${{ steps.secrets.outputs.TOKENS_API_STAGE_URL }}
          TOKENS_APP_BASE_URL: ${{ steps.secrets.outputs.TOKENS_APP_STAGE_URL }}
          TOKENS_API_KEY: ${{ steps.secrets.outputs.TOKENS_API_KEY_STAGING }}
        run: bun scripts/smoke-canary.ts


  # Runs BEFORE the prod Vercel deploys: services must speak the new RPC
  # surface before the API that calls it goes live. The post-deploy canary
  # here probes the OLD API against the new services (additive-safe check).
  cloudrun_prd:
    needs: [changes, deploy_stage]
    if: needs.changes.outputs.services != '[]' && needs.deploy_stage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDRUN_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker us-east4-docker.pkg.dev --quiet

      - name: Build and push image
        id: build
        env:
          IMAGE: us-east4-docker.pkg.dev/${{ vars.GCP_PROJECT }}/tokens-prd/${{ matrix.service }}:${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" -f apps/cloudrun-${{ matrix.service }}/Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run revision (prd)
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ matrix.service }}" = "assets" ]; then
            extra+=(--update-env-vars=SERVICE_ROLE=api,PG_POOL_MAX=16,PG_CONNECT_TIMEOUT=3)
            candidate_tag="resilience-${GITHUB_SHA:0:12}"
            gcloud run deploy tokens-assets-prd-us \
              --image="$IMAGE" \
              --region=us-east4 \
              --project=${{ vars.GCP_PROJECT }} \
              --no-traffic \
              --tag="$candidate_tag" \
              "${extra[@]}" \
              --quiet
            candidate_revision=$(gcloud run services describe tokens-assets-prd-us --region=us-east4 --project=${{ vars.GCP_PROJECT }} --format='value(status.latestCreatedRevisionName)')
            {
              echo "### Assets production candidate"
              echo "Revision \`$candidate_revision\` was deployed with **0% traffic**."
              echo "Promote it manually through 10% → 50% → 100% using the assets DB resilience runbook."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            gcloud run deploy tokens-${{ matrix.service }}-prd-us \
              --image="$IMAGE" \
              --region=us-east4 \
              --project=${{ vars.GCP_PROJECT }} \
              --quiet
          fi
          if [ "${{ matrix.service }}" = "assets" ] && gcloud run services describe tokens-assets-jobs-prd-us --region=us-east4 --project=${{ vars.GCP_PROJECT }} >/dev/null 2>&1; then
            # Tag + service name are capped at 46 chars; the jobs service name is
            # 25, so the API's resilience-<sha12> tag (23) does not fit here.
            gcloud run deploy tokens-assets-jobs-prd-us --image="$IMAGE" --region=us-east4 --project=${{ vars.GCP_PROJECT }} --update-env-vars=SERVICE_ROLE=worker,PG_POOL_MAX=8,PG_CONNECT_TIMEOUT=3 --no-traffic --tag="res-${GITHUB_SHA:0:12}" --quiet
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - run: bun install --frozen-lockfile

      - name: Post-deploy prod canary
        run: |
          set -euo pipefail
          export TOKENS_API_BASE_URL=$(doppler secrets get TOKENS_API_PROD_URL --plain --project tokens --config prd)
          export TOKENS_APP_BASE_URL=$(doppler secrets get TOKENS_APP_PROD_URL --plain --project tokens --config prd)
          export TOKENS_WEB_BASE_URL=https://tokens.xyz
          export TOKENS_API_KEY=$(doppler secrets get TOKENS_API_KEY --plain --project tokens --config prd)
          export SMOKE_REQUIRE_PROD_CLERK=true
          bun scripts/smoke-canary.ts


  deploy_prod:
    needs: [changes, notify_start, deploy_stage, cloudrun_prd]
    if: >-
      always() &&
      needs.deploy_stage.result == 'success' &&
      (needs.cloudrun_prd.result == 'success' || needs.cloudrun_prd.result == 'skipped')
    runs-on: ubuntu-latest
    # Budget: ~5 min setup + up to 75 min waiting for the manual assets
    # candidate promotion (runbook holds ≥15 min at 10% and at 50%) + ~40 min
    # for the prod deploys, canaries, and a full rollback.
    timeout-minutes: 120
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: tokens
      DOPPLER_CONFIG: prd
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - run: bun install --frozen-lockfile

      - name: Fetch secrets from Doppler
        id: secrets
        run: |
          set -euo pipefail
          for key in \
            SLACK_DEPLOY_WEBHOOK_URL \
            VERCEL_TOKEN \
            VERCEL_PROJECT_ID \
            VERCEL_PROJECT_ID_APP \
            VERCEL_PROJECT_ID_ADMIN \
            TOKENS_API_KEY \
            TOKENS_API_KEY_STAGING \
            CLERK_JWT_ISSUER_DOMAIN \
            TOKENS_API_STAGE_URL \
            TOKENS_API_PROD_URL \
            TOKENS_APP_STAGE_URL \
            TOKENS_APP_PROD_URL \
            TOKENS_ADMIN_STAGE_URL \
            TOKENS_ADMIN_PROD_URL; do
            value=$(doppler secrets get "$key" --plain --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG")
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Build Slack fields
        id: summary
        env:
          TIERS: ${{ needs.changes.outputs.tiers }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          FIELDS=$(jq -n \
            --arg tiers      "$TIERS" \
            --arg short_sha  "${SHA:0:7}" \
            --arg commit_msg "$COMMIT_MSG" \
            --arg actor      "$ACTOR" \
            --arg run_url    "$RUN_URL" \
            --arg run_id     "$RUN_ID" \
            '[
              {type:"mrkdwn",text:("*Tiers:*\n`"+$tiers+"`")},
              {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
              {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
              {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
            ]')
          {
            echo 'fields<<JQ_EOF'
            echo "$FIELDS"
            echo 'JQ_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: bun add -g vercel@54.9.0

      # The assets prod deploy is a deliberate 0%-traffic candidate (manual
      # 10→50→100 promotion per the DB-resilience runbook). Shipping the new
      # API while assets traffic is still on the old revision recreates the
      # 2026-09-04 incident, so when this release touches assets we hold the
      # Vercel prod deploys until the candidate serves 100% of traffic.
      - id: gcp_auth
        if: contains(fromJson(needs.changes.outputs.services), 'assets')
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDRUN_DEPLOYER_SA }}

      - if: contains(fromJson(needs.changes.outputs.services), 'assets')
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2

      - name: Wait for assets candidate promotion (manual)
        if: contains(fromJson(needs.changes.outputs.services), 'assets')
        env:
          SLACK_WEBHOOK: ${{ steps.secrets.outputs.SLACK_DEPLOY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG="resilience-${GITHUB_SHA:0:12}"
          describe() {
            gcloud run services describe tokens-assets-prd-us \
              --region=us-east4 --project=${{ vars.GCP_PROJECT }} --format=json
          }
          candidate=$(describe | jq -r --arg tag "$TAG" \
            '.status.traffic[] | select(.tag == $tag) | .revisionName' | head -1)
          if [ -z "$candidate" ]; then
            echo "::error::No assets candidate revision tagged $TAG — did cloudrun_prd deploy?"
            exit 1
          fi
          served=$(describe | jq -r --arg rev "$candidate" \
            '[.status.traffic[] | select(.revisionName == $rev) | (.percent // 0)] | add')
          if [ "$served" = "100" ]; then
            echo "Candidate $candidate already serving 100% — continuing."
            exit 0
          fi
          MSG="Tokens Deploy is holding the prod Vercel deploys until assets candidate \\`$candidate\\` is promoted to 100% (currently ${served}%). Promote via: gcloud run services update-traffic tokens-assets-prd-us --region=us-east4 --project=${{ vars.GCP_PROJECT }} --to-revisions=$candidate=100 (10→50→100 per the resilience runbook). Run: $RUN_URL"
          echo "$MSG"
          echo "### Waiting for assets promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$MSG" '{text: ("⏳ " + $t)}')" "$SLACK_WEBHOOK" || true
          # 75 min: runbook-compliant promotion is ≥15 min observation at 10%
          # + ≥15 min at 50% + operator response/command time.
          deadline=$(( $(date +%s) + 4500 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            served=$(describe | jq -r --arg rev "$candidate" \
              '[.status.traffic[] | select(.revisionName == $rev) | (.percent // 0)] | add')
            echo "candidate $candidate serving ${served}%"
            if [ "$served" = "100" ]; then
              echo "Promotion complete — continuing with prod Vercel deploys."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Assets candidate $candidate was not promoted to 100% within 75 minutes. Promote it, then re-run this workflow — the prod Vercel deploys did NOT happen (the gate exits immediately on re-run once the candidate serves 100%)."
          exit 1

      # teamId is required for team-owned projects; without it the API returns
      # no deployments and rollback silently breaks.
      - name: Capture previous prod deployment ID (API)
        id: prev_api
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          PREV=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1" \
            | jq -r '.deployments[0].uid // empty')
          [ -n "$PREV" ] && echo "Previous API prod: $PREV" || echo "WARNING: no previous API prod deployment"
          echo "deployment_id=$PREV" >> "$GITHUB_OUTPUT"

      - name: Capture previous prod deployment ID (APP)
        id: prev_app
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID_APP: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_APP }}
        run: |
          set -euo pipefail
          PREV=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID_APP&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1" \
            | jq -r '.deployments[0].uid // empty')
          [ -n "$PREV" ] && echo "Previous APP prod: $PREV" || echo "WARNING: no previous APP prod deployment"
          echo "deployment_id=$PREV" >> "$GITHUB_OUTPUT"

      - name: Capture previous prod deployment ID (ADMIN)
        id: prev_admin
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID_ADMIN: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_ADMIN }}
        run: |
          set -euo pipefail
          PREV=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID_ADMIN&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1" \
            | jq -r '.deployments[0].uid // empty')
          [ -n "$PREV" ] && echo "Previous ADMIN prod: $PREV" || echo "WARNING: no previous ADMIN prod deployment"
          echo "deployment_id=$PREV" >> "$GITHUB_OUTPUT"

      - name: Deploy API to production
        id: deploy_api_prod
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          PROD_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope solana-foundation)
          echo "prod_url=$PROD_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed tokens-api prod: $PROD_URL"

      - name: Alias API prod to TOKENS_API_PROD_URL
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID }}
          PROD_URL: ${{ steps.deploy_api_prod.outputs.prod_url }}
          TOKENS_API_PROD_URL: ${{ steps.secrets.outputs.TOKENS_API_PROD_URL }}
        run: |
          set -euo pipefail
          domain="${TOKENS_API_PROD_URL#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"
          for attempt in 1 2 3; do
            if vercel alias set "$PROD_URL" "$domain" --token="$VERCEL_TOKEN" --scope solana-foundation; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "alias attempt $attempt failed, retrying in 5s..." >&2
              sleep 5
            fi
          done
          echo "alias failed after 3 attempts" >&2
          exit 1

      - name: Deploy APP to production
        id: deploy_app_prod
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_APP }}
        run: |
          set -euo pipefail
          PROD_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope solana-foundation)
          echo "prod_url=$PROD_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed tokens-app prod: $PROD_URL"

      - name: Alias APP prod to TOKENS_APP_PROD_URL
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_APP }}
          PROD_URL: ${{ steps.deploy_app_prod.outputs.prod_url }}
          TOKENS_APP_PROD_URL: ${{ steps.secrets.outputs.TOKENS_APP_PROD_URL }}
        run: |
          set -euo pipefail
          domain="${TOKENS_APP_PROD_URL#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"
          for attempt in 1 2 3; do
            if vercel alias set "$PROD_URL" "$domain" --token="$VERCEL_TOKEN" --scope solana-foundation; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "alias attempt $attempt failed, retrying in 5s..." >&2
              sleep 5
            fi
          done
          echo "alias failed after 3 attempts" >&2
          exit 1

      - name: Deploy ADMIN to production
        id: deploy_admin_prod
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_ADMIN }}
        run: |
          set -euo pipefail
          PROD_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope solana-foundation)
          echo "prod_url=$PROD_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed tokens-admin prod: $PROD_URL"

      - name: Alias ADMIN prod to TOKENS_ADMIN_PROD_URL
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID_ADMIN }}
          PROD_URL: ${{ steps.deploy_admin_prod.outputs.prod_url }}
          TOKENS_ADMIN_PROD_URL: ${{ steps.secrets.outputs.TOKENS_ADMIN_PROD_URL }}
        run: |
          set -euo pipefail
          domain="${TOKENS_ADMIN_PROD_URL#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"
          for attempt in 1 2 3; do
            if vercel alias set "$PROD_URL" "$domain" --token="$VERCEL_TOKEN" --scope solana-foundation; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "alias attempt $attempt failed, retrying in 5s..." >&2
              sleep 5
            fi
          done
          echo "alias failed after 3 attempts" >&2
          exit 1

      - name: Prod canary (run 1)
        id: canary_1
        env:
          TOKENS_API_BASE_URL: ${{ steps.secrets.outputs.TOKENS_API_PROD_URL }}
          TOKENS_APP_BASE_URL: ${{ steps.secrets.outputs.TOKENS_APP_PROD_URL }}
          # Public marketing site — guards against a prod deploy aliasing the
          # Clerk-gated dashboard onto the apex domain (login screen on tokens.xyz).
          TOKENS_WEB_BASE_URL: https://tokens.xyz
          TOKENS_API_KEY: ${{ steps.secrets.outputs.TOKENS_API_KEY }}
          SMOKE_REQUIRE_PROD_CLERK: true
        run: bun scripts/smoke-canary.ts

      - name: Cold-start gap
        run: sleep 15

      - name: Prod canary (run 2)
        id: canary_2
        env:
          TOKENS_API_BASE_URL: ${{ steps.secrets.outputs.TOKENS_API_PROD_URL }}
          TOKENS_APP_BASE_URL: ${{ steps.secrets.outputs.TOKENS_APP_PROD_URL }}
          TOKENS_WEB_BASE_URL: https://tokens.xyz
          TOKENS_API_KEY: ${{ steps.secrets.outputs.TOKENS_API_KEY }}
          SMOKE_REQUIRE_PROD_CLERK: true
        run: bun scripts/smoke-canary.ts

      # cancelled() included deliberately: a job-timeout is a cancellation, and
      # without it a timeout after an app went live would strand a partial
      # release with no rollback (steps with failure()-only conditions are
      # skipped on cancel).
      - name: Rollback (post-prod-deploy failure)
        if: >-
          (failure() || cancelled()) &&
          (steps.deploy_api_prod.outcome == 'success' || steps.deploy_app_prod.outcome == 'success' || steps.deploy_admin_prod.outcome == 'success')
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
          PREV_API: ${{ steps.prev_api.outputs.deployment_id }}
          PREV_APP: ${{ steps.prev_app.outputs.deployment_id }}
          PREV_ADMIN: ${{ steps.prev_admin.outputs.deployment_id }}
          DEPLOYED_API: ${{ steps.deploy_api_prod.outcome }}
          DEPLOYED_APP: ${{ steps.deploy_app_prod.outcome }}
          DEPLOYED_ADMIN: ${{ steps.deploy_admin_prod.outcome }}
          TOKENS_API_PROD_URL: ${{ steps.secrets.outputs.TOKENS_API_PROD_URL }}
          TOKENS_APP_PROD_URL: ${{ steps.secrets.outputs.TOKENS_APP_PROD_URL }}
          TOKENS_ADMIN_PROD_URL: ${{ steps.secrets.outputs.TOKENS_ADMIN_PROD_URL }}
          SLACK_WEBHOOK: ${{ steps.secrets.outputs.SLACK_DEPLOY_WEBHOOK_URL }}
          FIELDS: ${{ steps.summary.outputs.fields }}
          TIERS: ${{ needs.changes.outputs.tiers }}
        run: |
          set -euo pipefail

          api_status="skipped"
          app_status="skipped"
          admin_status="skipped"

          # `vercel rollback` does NOT restore custom-domain aliases — without
          # this, the prod domain keeps serving the broken deployment even
          # though the rollback "succeeds" (2026-09-04 incident).
          realias() {
            target_id="$1"
            domain="${2#https://}"; domain="${domain#http://}"; domain="${domain%/}"
            for attempt in 1 2 3; do
              if vercel alias set "$target_id" "$domain" --token="$VERCEL_TOKEN" --scope solana-foundation; then
                return 0
              fi
              [ "$attempt" -lt 3 ] && sleep 5
            done
            return 1
          }

          if [ "$DEPLOYED_API" = "success" ]; then
            if [ -n "$PREV_API" ]; then
              if vercel rollback "$PREV_API" --token="$VERCEL_TOKEN" --scope solana-foundation \
                 && realias "$PREV_API" "$TOKENS_API_PROD_URL"; then
                api_status="rolled_back"
              else
                api_status="rollback_failed"
              fi
            else
              api_status="no_prev_deployment"
            fi
          fi

          if [ "$DEPLOYED_APP" = "success" ]; then
            if [ -n "$PREV_APP" ]; then
              if vercel rollback "$PREV_APP" --token="$VERCEL_TOKEN" --scope solana-foundation \
                 && realias "$PREV_APP" "$TOKENS_APP_PROD_URL"; then
                app_status="rolled_back"
              else
                app_status="rollback_failed"
              fi
            else
              app_status="no_prev_deployment"
            fi
          fi

          if [ "$DEPLOYED_ADMIN" = "success" ]; then
            if [ -n "$PREV_ADMIN" ]; then
              if vercel rollback "$PREV_ADMIN" --token="$VERCEL_TOKEN" --scope solana-foundation \
                 && realias "$PREV_ADMIN" "$TOKENS_ADMIN_PROD_URL"; then
                admin_status="rolled_back"
              else
                admin_status="rollback_failed"
              fi
            else
              admin_status="no_prev_deployment"
            fi
          fi

          PAYLOAD=$(jq -n \
            --arg marker "[ROLLBACK] Tokens Deploy" \
            --arg tiers "$TIERS" \
            --arg color "#ff8800" \
            --argjson fields "$FIELDS" \
            --arg api "$api_status" \
            --arg app "$app_status" \
            --arg admin "$admin_status" \
            --arg prev_api "$PREV_API" \
            --arg prev_app "$PREV_APP" \
            --arg prev_admin "$PREV_ADMIN" \
            '{
              text: ("*" + $marker + "* — tiers: `" + $tiers + "`"),
              attachments: [{
                color: $color,
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "* — failure after prod deploy")}},
                  {type:"section", fields:$fields},
                  {type:"section", text:{type:"mrkdwn", text:("*tokens-api:* "+$api+(if $prev_api != "" then " (target `"+$prev_api+"`)" else "" end)+"\n*tokens-app:* "+$app+(if $prev_app != "" then " (target `"+$prev_app+"`)" else "" end)+"\n*tokens-admin:* "+$admin+(if $prev_admin != "" then " (target `"+$prev_admin+"`)" else "" end))}}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK"
          exit 1

      - name: Annotate Grafana with deploy marker
        if: success()
        env:
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          GRAFANA_API_URL=$(doppler secrets get GRAFANA_API_URL --plain --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" 2>/dev/null)
          GRAFANA_API_TOKEN=$(doppler secrets get GRAFANA_API_TOKEN --plain --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" 2>/dev/null)
          if [ -z "$GRAFANA_API_URL" ] || [ -z "$GRAFANA_API_TOKEN" ]; then
            echo "::warning::GRAFANA_API_URL/TOKEN not set in Doppler — skipping deploy annotation"
            exit 0
          fi
          echo "::add-mask::$GRAFANA_API_TOKEN"
          SHA=$(git rev-parse --short HEAD)
          NOW_MS=$(( $(date +%s) * 1000 ))
          PAYLOAD=$(jq -n \
            --argjson ts "$NOW_MS" \
            --arg sha "$SHA" --arg actor "$ACTOR" --arg run_url "$RUN_URL" \
            '{
              time: $ts,
              tags: ["deploy", "tokens-xyz", "prod"],
              text: ("Deploy `" + $sha + "` by " + $actor + " — <" + $run_url + "|run>")
            }')
          curl -sS --fail-with-body -X POST "$GRAFANA_API_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD" || echo "::warning::Grafana annotation post failed (non-blocking)"

  notify_end:
    needs: [changes, deploy_stage, deploy_prod, cloudrun_prd]
    if: always() && needs.deploy_stage.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Notify Slack — deploy finished
        env:
          TIERS: ${{ needs.changes.outputs.tiers }}
          DEPLOY_RESULT: ${{ needs.deploy_prod.result }}
          ASSETS_RESULT: ${{ needs.cloudrun_prd.result }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SLACK_WEBHOOK=$(doppler secrets get SLACK_DEPLOY_WEBHOOK_URL --plain --project tokens --config prd)
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          if [ "$DEPLOY_RESULT" = "success" ] && { [ "$ASSETS_RESULT" = "success" ] || [ "$ASSETS_RESULT" = "skipped" ]; }; then
            STATUS=SUCCESS
            COLOR='#36a64f'
          else
            STATUS=FAILED
            COLOR='#ff0000'
          fi
          SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          PAYLOAD=$(jq -n \
            --arg marker "[$STATUS] Tokens Deploy" \
            --arg tiers "$TIERS" \
            --arg color "$COLOR" \
            --arg short_sha "${SHA:0:7}" --arg commit_msg "$COMMIT_MSG" \
            --arg actor "$ACTOR" --arg run_url "$RUN_URL" --arg run_id "$RUN_ID" \
            --arg vercel "$DEPLOY_RESULT" --arg assets "$ASSETS_RESULT" \
            '{
              text: ("*" + $marker + "* — tiers: `" + $tiers + "`"),
              attachments: [{
                color: $color,
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                  {type:"section", fields:[
                    {type:"mrkdwn",text:("*Tiers:*\n`"+$tiers+"`")},
                    {type:"mrkdwn",text:("*Result:*\n`api+app: "+$vercel+"` `cloud-run/assets: "+$assets+"`")},
                    {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
                    {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
                    {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
                  ]}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK" || true
