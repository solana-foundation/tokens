name: CI

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      CLERK_JWT_ISSUER_DOMAIN: https://clerk.example.com
      CLERK_AUTHORIZED_PARTIES: http://localhost:3000
      TOKENS_ADMIN_CLERK_USER_IDS: user_test_admin
      TOKENS_API_ORIGIN: https://api.example.com
      TOKENS_PLATFORM_API_KEY: test_platform_key
      TOKENS_CACHE_WARM_SECRET: test_cache_warm_secret
      TOKENS_IMAGE_PROXY_ALLOWED_HOSTS: assets.coingecko.com
      NEXT_PUBLIC_POSTHOG_KEY: phc_test_placeholder
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      NEXT_PUBLIC_POSTHOG_DEBUG: false
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com
      API_BASE_URL: https://api.example.com
      BIRDEYE_API_KEY: test_birdeye_key
      COINGECKO_API_KEY: test_coingecko_key
      DD_API_KEY: test_dd_key
      OPENAI_API_KEY: test_openai_key
      RWA_API_KEY: test_rwa_key
      SANCTUM_API_KEY: test_sanctum_key
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: test_upstash_token
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile
      - run: bun run check:repo-hygiene
      - run: bun run verify:api-health-routes
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
